name: "C — Déploiement production (paiements désactivés)"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Taper DEPLOYER pour confirmer (paiements resteront désactivés)"
        required: true
        default: ""

jobs:
  production:
    name: Provision production + déploiement (PAYMENT_MODE=disabled)
    runs-on: ubuntu-latest
    # GARDE ANTI-FORK : jamais de secret hors du dépôt officiel.
    if: >
      github.repository == 'mdgejc14-hash/vitrine-video-server' &&
      github.event.inputs.confirm == 'DEPLOYER'
    permissions:
      contents: read
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d7dac13da931423a19812f6d9116bd47

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Qualité locale (lint + types + 15 scénarios workerd/D1)
        run: |
          printf '%s\n' \
            "DEVICE_ID_HMAC_SECRET=test-hmac-secret-0123456789abcdef0123456789abcdef" \
            "ADMIN_METRICS_TOKEN=test-admin-token-0123456789abcdef" \
            "SIMULATION_SECRET=test-simulation-secret-0123456789abcdef" > .dev.vars
          npm run lint
          npm run typecheck
          npm test

      # Vérification EXPLICITE : la production doit avoir
      # PAYMENT_MODE=disabled et CINETPAY_ENABLED=false dans wrangler.jsonc.
      - name: Garde production (paiements désactivés obligatoires)
        run: |
          python3 -c '
          import json, re
          s = open("wrangler.jsonc").read()
          s = re.sub(r"//[^\n]*", "", s)
          cfg = json.loads(s)
          prod = cfg["env"]["production"]["vars"]
          assert prod["PAYMENT_MODE"] == "disabled", prod
          assert prod["CINETPAY_ENABLED"] == "false", prod
          print("OK : production PAYMENT_MODE=disabled, CINETPAY_ENABLED=false")
          '

      - name: "Vérification — aucun secret dans le dépôt"
        run: |
          ! grep -rInE "(CINETPAY_API_KEY|SECRET_KEY)[\"']?\s*[:=]\s*[\"'][A-Za-z0-9]{8,}" \
            --include="*.ts" --include="*.jsonc" --include="*.json" --include="*.yml" . \
            --exclude-dir=node_modules || {
              echo "!! Un secret semble committé" >&2; exit 1; }

      # Sonde : le token sait-il déployer (Workers Scripts:Edit) ?
      # PUT sans module : 400 = droit présent (rejet de validation, aucun
      # effet), 403 = droit absent → déploiement impossible, message clair.
      - name: "Sonde : droit de déploiement Workers"
        id: probe
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Sonde STRICTE : multipart sans module. Un token autorisé obtient
          # 400 (module manquant = validation APRÈS autorisation) ; un token
          # sans droit obtient 403. Tout autre code (401/415/5xx/000) est
          # traité comme ABSENCE de droit (prudence).
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata={"main_module":"index.js","compatibility_date":"2025-09-06"};type=application/json' \
            "https://api.cloudflare.com/client/v4/accounts/d7dac13da931423a19812f6d9116bd47/workers/scripts/vvl-perm-probe")
          if [[ "$CODE" == "400" ]]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "droit de déploiement présent (sonde HTTP $CODE)"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "!! Le token n'a pas le droit Workers Scripts:Edit — déploiement IMPOSSIBLE (sonde HTTP $CODE ; ajouter la permission au token puis relancer)" >&2
          fi

      # Secrets production : persistés dans le cache Actions, masqués.
      # PAS de SIMULATION_SECRET en production.
      - name: Cache des secrets production (valeurs masquées)
        uses: actions/cache@v4
        with:
          path: .provision-secrets
          key: production-secrets-v1

      - name: Préparation des secrets production
        id: secrets
        run: |
          mkdir -p .provision-secrets
          if [[ ! -f .provision-secrets/production.json ]]; then
            python3 -c "import json,secrets as s; json.dump({k:s.token_hex(32) for k in ('PROD_DEVICE_ID_HMAC_SECRET','PROD_ADMIN_METRICS_TOKEN')}, open('.provision-secrets/production.json','w'))"
            echo "nouveaux secrets production générés"
          else
            echo "secrets production réutilisés depuis le cache"
          fi
          for k in PROD_DEVICE_ID_HMAC_SECRET PROD_ADMIN_METRICS_TOKEN; do
            v=$(python3 -c "import json;print(json.load(open('.provision-secrets/production.json'))['$k'])")
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done

      - name: Provision D1 production + migrations
        if: env.CF_TOKEN != '' && steps.probe.outputs.can_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./scripts/provision.sh --only production

      - name: Déploiement du Worker production
        if: env.CF_TOKEN != '' && steps.probe.outputs.can_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env production

      # Secrets APRÈS le déploiement (un secret exige un Worker existant).
      # PAS de SIMULATION_SECRET en production.
      - name: Secrets production au Worker
        if: env.CF_TOKEN != '' && steps.probe.outputs.can_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD_DEVICE_ID_HMAC_SECRET: ${{ steps.secrets.outputs.PROD_DEVICE_ID_HMAC_SECRET }}
          PROD_ADMIN_METRICS_TOKEN: ${{ steps.secrets.outputs.PROD_ADMIN_METRICS_TOKEN }}
        run: ./scripts/provision.sh --secrets --only production

      - name: "Vérification post-déploiement (/health production)"
        if: env.CF_TOKEN != '' && steps.probe.outputs.can_deploy == 'true'
        run: |
          sleep 10
          curl -fsS --max-time 30 \
            https://vitrine-video-lite-api.mdgejcinfluence.workers.dev/health \
            -o health-prod.json
          python3 -c '
          import json
          h = json.load(open("health-prod.json"))
          assert h["environment"] == "production", h
          assert h["payment_mode"] == "disabled", h
          print("OK : production en ligne, paiements désactivés :", h)
          '

      - name: wrangler.jsonc canonique restauré
        if: always()
        run: git checkout -- wrangler.jsonc 2>/dev/null || true

      - name: Résumé
        if: always()
        run: |
          echo "## C — production" >> $GITHUB_STEP_SUMMARY
          echo "- Déploiement : ${{ steps.probe.outputs.can_deploy == 'true' && 'effectué' || 'BLOQUÉ (token absent ou sans droit Workers Scripts:Edit)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Paiements : DÉSACTIVÉS (PAYMENT_MODE=disabled, CINETPAY_ENABLED=false)" >> $GITHUB_STEP_SUMMARY
