name: "B — Déploiement staging + E2E réseau"

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL de base du Worker staging (déjà déployé)"
        required: false
        default: "https://vitrine-video-lite-api-staging.mdgejcinfluence.workers.dev"
  push:
    branches: [main]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  staging-e2e:
    name: Provision + déploiement staging + scénarios HTTP
    runs-on: ubuntu-latest
    # GARDE ANTI-FORK : jamais de secret hors du dépôt officiel.
    if: github.repository == 'mdgejc14-hash/vitrine-video-server'
    permissions:
      contents: read
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d7dac13da931423a19812f6d9116bd47

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Qualité locale (lint + types + 15 scénarios workerd/D1)
        run: |
          printf '%s\n' \
            "DEVICE_ID_HMAC_SECRET=test-hmac-secret-0123456789abcdef0123456789abcdef" \
            "ADMIN_METRICS_TOKEN=test-admin-token-0123456789abcdef" \
            "SIMULATION_SECRET=test-simulation-secret-0123456789abcdef" > .dev.vars
          npm run lint
          npm run typecheck
          npm test

      # ------------------------------------------------------------------
      # Secrets applicatifs staging : générés une fois puis PERSISTÉS dans
      # le cache Actions (jamais dans le dépôt, jamais dans les journaux —
      # chaque valeur est masquée par add-mask). Pas de rotation du secret
      # HMAC : les hash de terminaux restent stables d'un déploiement à
      # l'autre.
      # ------------------------------------------------------------------
      - name: Cache des secrets staging (valeurs masquées)
        uses: actions/cache@v4
        with:
          path: .provision-secrets
          key: staging-secrets-v1

      - name: Préparation des secrets (génération si absents)
        id: secrets
        run: |
          mkdir -p .provision-secrets
          if [[ ! -f .provision-secrets/staging.json ]]; then
            python3 -c "import json,secrets as s; json.dump({k:s.token_hex(32) for k in ('DEVICE_ID_HMAC_SECRET','ADMIN_METRICS_TOKEN','SIMULATION_SECRET')}, open('.provision-secrets/staging.json','w'))"
            echo "nouveaux secrets staging générés (rotation impossible ensuite)"
          else
            echo "secrets staging réutilisés depuis le cache (hash stables)"
          fi
          for k in DEVICE_ID_HMAC_SECRET ADMIN_METRICS_TOKEN SIMULATION_SECRET; do
            v=$(python3 -c "import json;print(json.load(open('.provision-secrets/staging.json'))['$k'])")
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done

      # ------------------------------------------------------------------
      # Sonde de droits : le token sait-il DÉPLOYER (Workers Scripts:Edit) ?
      # PUT sans module : 400 = droit présent (rejet de validation, aucun
      # effet), 403 = droit absent. Sans ce droit : D1 reste provisionnable
      # mais le déploiement et l'E2E réseau sont sautés proprement.
      # ------------------------------------------------------------------
      - name: "Sonde : droit de déploiement Workers"
        id: probe
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Sonde STRICTE : multipart sans module. Un token autorisé obtient
          # 400 (module manquant = validation APRÈS autorisation) ; un token
          # sans droit obtient 403. Tout autre code (401/415/5xx/000) est
          # traité comme ABSENCE de droit (prudence).
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata={"main_module":"index.js","compatibility_date":"2025-09-06"};type=application/json' \
            "https://api.cloudflare.com/client/v4/accounts/d7dac13da931423a19812f6d9116bd47/workers/scripts/vvl-perm-probe")
          if [[ "$CODE" == "400" ]]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            echo "droit de déploiement présent (sonde HTTP $CODE)"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "droit de déploiement ABSENT (sonde HTTP $CODE) — déploiement sauté"
          fi

      # ------------------------------------------------------------------
      # Provision D1 STAGING UNIQUEMENT (création si absente — jamais de
      # suppression), migrations non destructives, secrets au Worker.
      # ------------------------------------------------------------------
      - name: Provision D1 staging + migrations + secrets
        if: env.CF_TOKEN != '' && steps.probe.outputs.can_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEVICE_ID_HMAC_SECRET: ${{ steps.secrets.outputs.DEVICE_ID_HMAC_SECRET }}
          ADMIN_METRICS_TOKEN: ${{ steps.secrets.outputs.ADMIN_METRICS_TOKEN }}
          SIMULATION_SECRET: ${{ steps.secrets.outputs.SIMULATION_SECRET }}
        run: ./scripts/provision.sh --apply-config --only staging

      - name: Déploiement du Worker staging
        if: env.CF_TOKEN != '' && steps.probe.outputs.can_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # ------------------------------------------------------------------
      # E2E réseau : scénarios rejoués en HTTP réel (terminaux de test
      # dédiés e2e-test-*, aucune donnée réelle). Tests 7/9/11 (expirations
      # exactes 24 h / 30 j) : validés par l'étape locale (FixedClock).
      # ------------------------------------------------------------------
      - name: E2E staging (scénarios HTTP)
        if: env.CF_TOKEN != '' && steps.probe.outputs.can_deploy == 'true'
        env:
          BASE_URL: ${{ inputs.base_url || 'https://vitrine-video-lite-api-staging.mdgejcinfluence.workers.dev' }}
          SIMULATION_SECRET: ${{ steps.secrets.outputs.SIMULATION_SECRET }}
          ADMIN_METRICS_TOKEN: ${{ steps.secrets.outputs.ADMIN_METRICS_TOKEN }}
        run: ./scripts/e2e-runner.sh staging

      - name: wrangler.jsonc canonique restauré (rien à committer)
        if: always()
        run: git checkout -- wrangler.jsonc 2>/dev/null || true

      - name: Résumé
        if: always()
        run: |
          echo "## B — staging" >> $GITHUB_STEP_SUMMARY
          echo "- Déploiement : ${{ steps.probe.outputs.can_deploy == 'true' && 'effectué' || 'SAUTÉ (token absent ou sans droit Workers Scripts:Edit) — qualité locale seulement' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Qualité locale : lint + typecheck + 15 scénarios" >> $GITHUB_STEP_SUMMARY
